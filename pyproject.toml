[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "isopropyl"
version = "0.1.0"
description = "A guarded USB image writer for Linux, macOS and Windows"
readme = "README.md"
requires-python = ">=3.10"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md", "licenses/*"]
authors = [{name = "ISOpropyl contributors"}]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: X11 Applications :: Qt",
  "Operating System :: POSIX :: Linux",
  "Operating System :: MacOS :: MacOS X",
  "Operating System :: Microsoft :: Windows",
  "Programming Language :: Python :: 3",
  "Topic :: System :: Installation/Setup",
]
dependencies = [
  "PyQt6>=6.8,<7; sys_platform != 'darwin' and sys_platform != 'win32'",
  "PyQt6>=6.8,<6.12; sys_platform == 'darwin' or sys_platform == 'win32'",
  "zstandard>=0.23,<1; sys_platform == 'darwin' or sys_platform == 'win32'",
  "dissect.ntfs==3.16; sys_platform == 'darwin' or sys_platform == 'win32'",
  "dissect.extfs==3.15; sys_platform == 'darwin' or sys_platform == 'win32'",
  "dissect.fat==3.13; sys_platform == 'darwin' or sys_platform == 'win32'",
  "signify==0.9.2",
  "asn1crypto==1.5.1",
  "certvalidator==0.11.1",
  "oscrypto==1.3.0",
  "mscerts==2026.7.1",
  "typing-extensions==4.16.0",
]

[project.urls]
Homepage = "https://github.com/codebooker/isopropyl"
Repository = "https://github.com/codebooker/isopropyl.git"
Issues = "https://github.com/codebooker/isopropyl/issues"

[project.gui-scripts]
isopropyl = "isopropyl.entrypoints:gui"

[project.scripts]
isopropyl-cli = "isopropyl.entrypoints:cli"

[tool.setuptools.packages.find]
include = ["isopropyl*"]

[tool.setuptools.package-data]
isopropyl = ["data/*.bin", "data/*.hex", "data/*.json", "data/*.svg", "helpers/*/*", "helpers/*/licenses/*"]

[tool.setuptools.data-files]
"share/applications" = ["data/io.github.codebooker.isopropyl.desktop"]
"share/icons/hicolor/scalable/apps" = ["data/io.github.codebooker.isopropyl.svg"]
"share/icons/hicolor/48x48/apps" = ["data/icons/48x48/apps/io.github.codebooker.isopropyl.png"]
"share/icons/hicolor/64x64/apps" = ["data/icons/64x64/apps/io.github.codebooker.isopropyl.png"]
"share/icons/hicolor/128x128/apps" = ["data/icons/128x128/apps/io.github.codebooker.isopropyl.png"]
"share/icons/hicolor/256x256/apps" = ["data/icons/256x256/apps/io.github.codebooker.isopropyl.png"]
"share/metainfo" = ["data/io.github.codebooker.isopropyl.metainfo.xml"]

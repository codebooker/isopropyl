<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">ISOpropyl — Bootable media, made simple.</title>
  <desc id="desc">Project banner for the ISOpropyl Linux USB image writer.</desc>
  <defs>
    <linearGradient id="hero-bg" x1="60" y1="20" x2="1130" y2="350" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1B2331"/>
      <stop offset="0.58" stop-color="#111720"/>
      <stop offset="1" stop-color="#0B0F15"/>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientTransform="translate(225 168) rotate(25) scale(310 245)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F58A26" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#F58A26" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="drop" x1="200" y1="115" x2="235" y2="250" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFB34F"/>
      <stop offset="1" stop-color="#F47D20"/>
    </linearGradient>
    <radialGradient id="disc" cx="0" cy="0" r="1" gradientTransform="translate(148 121) rotate(48) scale(128)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF"/>
      <stop offset="0.7" stop-color="#E7ECF3"/>
      <stop offset="1" stop-color="#BFC8D5"/>
    </radialGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#020409" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect width="1200" height="360" rx="34" fill="url(#hero-bg)"/>
  <rect width="1200" height="360" rx="34" fill="url(#glow)"/>
  <rect x="1" y="1" width="1198" height="358" rx="33" fill="none" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="2"/>

  <g transform="translate(70 38)" filter="url(#shadow)">
    <circle cx="140" cy="140" r="98" fill="url(#disc)"/>
    <circle cx="140" cy="140" r="73" fill="none" stroke="#AAB5C5" stroke-opacity="0.58" stroke-width="3"/>
    <path d="M72 177a98 98 0 0 0 88 59" fill="none" stroke="#F58A26" stroke-width="13" stroke-linecap="round"/>
    <path d="M96 62a98 98 0 0 1 106 15" fill="none" stroke="#FFFFFF" stroke-opacity="0.72" stroke-width="7" stroke-linecap="round"/>
    <circle cx="140" cy="140" r="27" fill="#171D27"/>
    <circle cx="140" cy="140" r="10" fill="#F6922E"/>
    <path d="M232 84s-48 59-48 100c0 31 21 54 48 54s48-23 48-54c0-41-48-100-48-100Z" fill="url(#drop)" stroke="#FFD291" stroke-width="4" stroke-linejoin="round"/>
    <path d="M222 120c-12 18-23 40-23 59 0 10 3 19 9 27" fill="none" stroke="#FFF4DF" stroke-opacity="0.72" stroke-width="8" stroke-linecap="round"/>
  </g>

  <text x="440" y="143" fill="#F8FAFD" font-family="DejaVu Sans, Noto Sans, sans-serif" font-size="76" font-weight="700" letter-spacing="-2">ISO<tspan fill="#F6922E">propyl</tspan></text>
  <text x="444" y="202" fill="#D0D7E2" font-family="DejaVu Sans, Noto Sans, sans-serif" font-size="27" font-weight="500">Bootable media, made simple.</text>
  <text x="444" y="249" fill="#929EAF" font-family="DejaVu Sans, Noto Sans, sans-serif" font-size="19">A capable, safety-first USB image writer for Linux.</text>

  <g transform="translate(444 281)" font-family="DejaVu Sans, Noto Sans, sans-serif" font-size="14" font-weight="650" letter-spacing="1.2">
    <rect width="70" height="32" rx="16" fill="#FFFFFF" fill-opacity="0.07" stroke="#FFFFFF" stroke-opacity="0.1"/>
    <text x="35" y="21" text-anchor="middle" fill="#C9D1DD">ISO</text>
    <rect x="82" width="74" height="32" rx="16" fill="#FFFFFF" fill-opacity="0.07" stroke="#FFFFFF" stroke-opacity="0.1"/>
    <text x="119" y="21" text-anchor="middle" fill="#C9D1DD">IMG</text>
    <rect x="168" width="88" height="32" rx="16" fill="#FFFFFF" fill-opacity="0.07" stroke="#FFFFFF" stroke-opacity="0.1"/>
    <text x="212" y="21" text-anchor="middle" fill="#C9D1DD">VHDX</text>
    <rect x="268" width="96" height="32" rx="16" fill="#FFFFFF" fill-opacity="0.07" stroke="#FFFFFF" stroke-opacity="0.1"/>
    <text x="316" y="21" text-anchor="middle" fill="#C9D1DD">QCOW2</text>
  </g>
</svg>

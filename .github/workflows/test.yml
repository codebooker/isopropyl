name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: sudo apt-get update && sudo apt-get install -y desktop-file-utils appstream
      - run: python -m pip install --disable-pip-version-check .
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q isopropyl tests
      - run: desktop-file-validate data/io.github.codebooker.isopropyl.desktop
      - run: appstreamcli validate --no-net data/io.github.codebooker.isopropyl.metainfo.xml

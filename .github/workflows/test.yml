name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    env:
      QT_QPA_PLATFORM: offscreen
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: sudo apt-get update && sudo apt-get install -y desktop-file-utils appstream binutils openssl sbsigntool wimtools libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3 libglib2.0-0t64
      - if: matrix.runner == 'ubuntu-24.04-arm'
        run: sudo apt-get install -y binutils-x86-64-linux-gnu
      - run: python -m pip install --disable-pip-version-check .
      - run: cd /tmp && isopropyl-cli --help
      - run: python -m pip install dissect.ntfs==3.16 dissect.extfs==3.15 dissect.fat==3.13
      - run: python -m unittest discover -s tests -v
        env:
          ISOPROPYL_REQUIRE_AUTHENTICODE_FIXTURE: "1"
      - run: python -m compileall -q isopropyl tests
      - run: desktop-file-validate data/io.github.codebooker.isopropyl.desktop
      - run: appstreamcli validate --no-net data/io.github.codebooker.isopropyl.metainfo.xml
      - run: python -m json.tool isopropyl/data/bootloaders-v2.json > /dev/null
      - run: python -m json.tool isopropyl/data/distro-write-policies-v1.json > /dev/null
      - run: python -m json.tool isopropyl/data/linux-images-v1.json > /dev/null
      - run: python -m json.tool isopropyl/data/windows-images-v2.json > /dev/null
      - run: cd /tmp && python -c "from isopropyl.windows_downloads import available_windows_images; r = available_windows_images(); assert {(x.architecture, x.filename) for x in r} == {('x64', 'Win11_25H2_English_x64_v2.iso'), ('ARM64', 'Win11_25H2_English_Arm64_v2.iso')}"
      - run: mkdir -p build/lib/isopropyl/data && touch build/lib/isopropyl/data/windows-images-v1.json
      - run: python -m pip wheel --no-deps . --wheel-dir /tmp/isopropyl-wheel
      - run: python -c "import glob,zipfile; z=zipfile.ZipFile(glob.glob('/tmp/isopropyl-wheel/*.whl')[0]); n=z.namelist(); assert 'isopropyl/data/io.github.codebooker.isopropyl.svg' in n; assert 'isopropyl/data/distro-write-policies-v1.json' in n; assert 'isopropyl/data/windows-images-v2.json' in n; assert 'isopropyl/data/windows-images-v1.json' not in n; assert any(x.endswith('/THIRD_PARTY_NOTICES.md') for x in n); assert any(x.endswith('/CERTVALIDATOR-MIT.txt') for x in n); e=next(x for x in n if x.endswith('.dist-info/entry_points.txt')); assert 'isopropyl-cli = isopropyl.entrypoints:cli' in z.read(e).decode()"
      - run: python -c "import pathlib,setuptools.build_meta as b; p=pathlib.Path('/tmp/isopropyl-sdist'); p.mkdir(); b.build_sdist(str(p))"
      - run: python -c "import glob,tarfile; t=tarfile.open(glob.glob('/tmp/isopropyl-sdist/*.tar.gz')[0]); n=t.getnames(); assert any(x.endswith('/tests/windows-profile-observations-v1.json') for x in n); assert not any(x.endswith('/isopropyl/data/windows-images-v1.json') for x in n)"
      - run: /usr/bin/python3 -I packaging/debian/build_deb.py --output-dir /tmp/isopropyl-deb
      - run: dpkg-deb --info /tmp/isopropyl-deb/*.deb
      - uses: actions/upload-artifact@v7
        with:
          name: isopropyl-debian-${{ matrix.runner }}
          path: /tmp/isopropyl-deb/*.deb
          if-no-files-found: error
          retention-days: 14

  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            cpu: arm64
          - runner: windows-2025
            cpu: x86_64
          - runner: windows-11-arm
            cpu: arm64
    runs-on: ${{ matrix.runner }}
    env:
      QT_QPA_PLATFORM: offscreen
      ISOPROPYL_EXPECT_CPU: ${{ matrix.cpu }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          architecture: ${{ matrix.cpu == 'arm64' && 'arm64' || 'x64' }}
      - run: python -m pip install --disable-pip-version-check .
      - run: python -c "import os; from isopropyl.host_platform import validate_host; assert validate_host()[1] == os.environ['ISOPROPYL_EXPECT_CPU']"
      - run: isopropyl-cli --help
      - run: python -m unittest tests.test_native_platform tests.test_native_devices tests.test_native_writer tests.test_native_inputs tests.test_native_inspection tests.test_native_downloads tests.test_native_tools tests.test_native_virtual tests.test_native_disk_io tests.test_native_app tests.test_native_cli tests.test_native_elevation tests.test_mac_write tests.test_devices -v
      - run: python -m unittest tests.test_windows_media tests.test_native_drive_parity tests.test_helper_tools tests.test_native_extract tests.test_native_options tests.test_native_media tests.test_compress_z -v
      - run: python tools/validate_native_helpers.py --require-all
      - if: runner.os == 'macOS'
        run: python -m unittest tests.test_mac_windows_iso tests.test_native_windows_options tests.test_windows tests.test_windows_bootex -v
      - run: python -m compileall -q isopropyl tests
      - run: python -m pip wheel --no-deps . --wheel-dir dist
      - uses: actions/upload-artifact@v7
        with:
          name: isopropyl-wheel-${{ matrix.runner }}-${{ matrix.cpu }}
          path: dist/*.whl
          if-no-files-found: error
